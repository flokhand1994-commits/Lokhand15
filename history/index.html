<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Story of the World</title>
<meta name="description" content="A chronological, beginner-friendly history of the world — from the Big Bang to today.">
<style>
:root{
  --bg:#f6f3ec;--paper:#fffdf8;--ink:#1f1b16;--muted:#6b6257;--line:#e3dccf;
  --accent:#8a3b12;--accent-soft:#f3e3d6;--chip:#efe8db;--good:#2f6b3a;
  --serif:Georgia,'Iowan Old Style','Palatino Linotype',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16130f;--paper:#1f1b16;--ink:#ece6dc;--muted:#a59c8f;--line:#352f27;
  --accent:#e09a6b;--accent-soft:#3a2a1f;--chip:#2a251f;--good:#7cc48a;}}
:root[data-theme="dark"]{
  --bg:#16130f;--paper:#1f1b16;--ink:#ece6dc;--muted:#a59c8f;--line:#352f27;
  --accent:#e09a6b;--accent-soft:#3a2a1f;--chip:#2a251f;--good:#7cc48a;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-text-size-adjust:100%}
a{color:var(--accent)}
button{font:inherit;color:inherit}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:10px;height:56px}
.brand{font-family:var(--serif);font-weight:700;font-size:1.15rem;text-decoration:none;color:var(--ink);white-space:nowrap}
.brand span{color:var(--accent)}
nav.tabs{display:flex;gap:4px;margin-left:auto}
nav.tabs a,.iconbtn{padding:6px 10px;line-height:1.2;border-radius:8px;text-decoration:none;color:var(--muted);font-size:.9rem;border:0;background:none;cursor:pointer}
nav.tabs a.on{background:var(--chip);color:var(--ink)}
.iconbtn{font-size:1.15rem}
.iconbtn:hover,nav.tabs a:hover{color:var(--ink)}
.progress{height:3px;background:var(--line)}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}

.hero{padding:36px 0 18px}
.hero h1{font-family:var(--serif);font-size:clamp(1.9rem,6vw,2.8rem);line-height:1.1;margin:0 0 10px}
.hero p{color:var(--muted);margin:0 0 16px;max-width:60ch}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-block;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--paper);text-decoration:none;color:var(--ink);cursor:pointer;font-size:.95rem}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#1f1b16}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#1f1b16}}
.stats{color:var(--muted);font-size:.85rem;margin-top:12px}

.tools{position:sticky;top:59px;z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line)}
.search{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:1rem}
.chips{display:flex;gap:6px;overflow-x:auto;padding-top:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-size:.82rem;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.eranav{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.eranav::-webkit-scrollbar{display:none}
.eranav a{flex:none;font-size:.8rem;color:var(--muted);text-decoration:none;padding:4px 10px;border-radius:999px;background:var(--chip)}

section.era{margin:28px 0}
.erahead{border-left:4px solid var(--accent);padding:4px 0 4px 14px;margin-bottom:12px}
.erahead .span{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600}
.erahead h2{font-family:var(--serif);margin:2px 0 6px;font-size:1.5rem}
.erahead p{margin:0;color:var(--muted);font-size:.95rem}
.erahead details{margin-top:6px}
.erahead summary{cursor:pointer;font-size:.85rem;color:var(--accent)}
.erahead details p{margin-top:8px;color:var(--ink)}

ol.timeline{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line)}
ol.timeline li{position:relative;margin:0 0 6px}
ol.timeline li::before{content:"";position:absolute;left:-21px;top:20px;width:10px;height:10px;border-radius:50%;background:var(--paper);border:2px solid var(--accent)}
ol.timeline li.read::before{background:var(--accent)}
.card{display:block;padding:10px 12px;border-radius:12px;text-decoration:none;color:var(--ink)}
.card:hover{background:var(--paper)}
.card .date{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.card h3{font-family:var(--serif);font-size:1.12rem;margin:1px 0 2px;line-height:1.25}
.card p{margin:0;color:var(--muted);font-size:.9rem}
.tag{display:inline-block;font-size:.7rem;padding:1px 7px;border-radius:999px;background:var(--chip);color:var(--muted);margin-right:4px;vertical-align:middle}
.check{color:var(--good);font-size:.8rem;margin-left:4px}
.empty{color:var(--muted);padding:30px 0;text-align:center}

article.full{padding:26px 0 40px}
.crumbs{font-size:.82rem;color:var(--muted);margin-bottom:12px}
.crumbs a{color:var(--muted)}
article.full h1{font-family:var(--serif);font-size:clamp(1.7rem,5.5vw,2.4rem);line-height:1.15;margin:4px 0 8px}
.meta{color:var(--muted);font-size:.88rem;display:flex;flex-wrap:wrap;gap:6px 14px;margin-bottom:16px}
.lede{font-family:var(--serif);font-size:1.2rem;line-height:1.5;border-left:3px solid var(--accent);padding-left:14px;margin:0 0 22px}
.body p{font-family:var(--serif);font-size:1.08rem;line-height:1.75;margin:0 0 1.1em}
.box{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:20px 0}
.box h4{margin:0 0 6px;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.box p{margin:0;font-family:var(--serif);font-size:1.02rem}
.box ul{margin:0;padding-left:18px}
.linkrow{display:flex;flex-wrap:wrap;gap:6px}
.linkrow a{font-size:.88rem;padding:5px 10px;border-radius:8px;background:var(--chip);text-decoration:none;color:var(--ink)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:28px}
.pager a{display:block;padding:12px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);background:var(--paper);min-width:0}
.pager a small{display:block;color:var(--muted);font-size:.75rem}
.pager a span{font-family:var(--serif);display:block;overflow:hidden;text-overflow:ellipsis}
.pager .next{text-align:right}
.markbtn{margin-top:10px}
.voice{display:inline-flex;gap:4px;padding:4px;border-radius:12px;background:var(--chip);margin:0 0 20px}
.voice button{border:0;background:none;padding:7px 12px;border-radius:9px;cursor:pointer;font-size:.88rem;color:var(--muted)}
.voice button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.body.story p:first-child::first-letter{font-size:3.1em;float:left;line-height:.9;margin:4px 8px 0 0;color:var(--accent);font-weight:700}

.concepts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;padding-bottom:40px}
.concepts a{display:block;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--paper);text-decoration:none;color:var(--ink)}
.concepts a b{font-family:var(--serif);font-size:1.05rem;display:block}
.concepts a span{font-size:.85rem;color:var(--muted)}
.grouphead{font-family:var(--serif);margin:26px 0 10px;font-size:1.25rem}
footer{color:var(--muted);font-size:.8rem;text-align:center;padding:30px 16px 50px;border-top:1px solid var(--line)}
@media (max-width:520px){nav.tabs a{padding:6px 7px;font-size:.84rem}.brand{font-size:1rem}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#/">The Story of the <span>World</span></a>
    <nav class="tabs">
      <a href="#/" data-tab="home">Timeline</a>
      <a href="#/ideas" data-tab="ideas">Ideas</a>
      <button class="iconbtn" id="theme" title="Toggle light/dark" aria-label="Toggle theme">☾</button>
    </nav>
  </div>
  <div class="progress"><i id="prog"></i></div>
</header>
<main id="app" class="wrap"></main>
<footer>Written for curious beginners. History is argued over; dates for ancient events are approximate.<br><a href="../index.html">← Back to the main site</a></footer>

<script>
window.H = {articles: [], concepts: [], eras: [],
  add(list){ this.articles.push(...list); },
  ideas(list){ this.concepts.push(...list); },
  era(list){ this.eras.push(...list); },
  stories: {}, story(map){ Object.assign(this.stories, map); }};
</script>
<script src="data/eras.js"></script>
<script src="data/concepts.js"></script>
<script src="data/01-origins.js"></script>
<script src="data/02-ancient.js"></script>
<script src="data/03-classical.js"></script>
<script src="data/04-medieval.js"></script>
<script src="data/05-early-modern.js"></script>
<script src="data/06-revolutions.js"></script>
<script src="data/07-world-wars.js"></script>
<script src="data/08-cold-war.js"></script>
<script src="data/09-contemporary.js"></script>
<script src="data/stories/01-origins.js"></script>
<script src="data/stories/02-ancient.js"></script>
<script src="data/stories/03-classical.js"></script>
<script src="data/stories/03b-classical.js"></script>
<script src="data/stories/04-medieval.js"></script>
<script src="data/stories/04b-medieval.js"></script>
<script src="data/stories/05-early-modern.js"></script>
<script src="data/stories/05b-early-modern.js"></script>
<script src="data/stories/06-revolutions.js"></script>
<script src="data/stories/06b-revolutions.js"></script>
<script src="data/stories/07-world-wars.js"></script>
<script src="data/stories/07b-world-wars.js"></script>
<script src="data/stories/08-cold-war.js"></script>
<script src="data/stories/08b-cold-war.js"></script>
<script src="data/stories/09-contemporary.js"></script>
<script src="data/stories/09b-contemporary.js"></script>
<script>
(function(){
const A = H.articles.slice().sort((a,b)=>a.y-b.y);
const byId = Object.fromEntries(A.map(a=>[a.id,a]));
const C = Object.fromEntries(H.concepts.map(c=>[c.id,c]));
const eraOf = y => { let e = H.eras[0]; for (const x of H.eras) if (y >= x.from) e = x; return e; };
A.forEach((a,i)=>{ a.i = i; a.era = eraOf(a.y); });

const CATS = {war:'Wars & conflict', empire:'Empires & states', revolution:'Revolutions', idea:'Ideas & religion',
  movement:'Movements', migration:'Migrations', science:'Science & technology', economy:'Economy & trade',
  disaster:'Disasters & disease', origins:'Origins'};

const store = {
  get(k,d){ try{ const v = localStorage.getItem('wh.'+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem('wh.'+k, JSON.stringify(v)); }catch(e){} }
};
let read = new Set(store.get('read', []));
let filter = {q:'', cat:''};
let voice = store.get('voice', 'story');
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function updateProgress(){
  document.getElementById('prog').style.width = (100*read.size/A.length)+'%';
}
function tags(a){ return a.c.map(c=>`<span class="tag">${esc(CATS[c]||c)}</span>`).join(''); }

function matches(a){
  if (filter.cat && !a.c.includes(filter.cat)) return false;
  if (!filter.q) return true;
  const hay = (a.t+' '+a.s+' '+a.b+' '+a.r+' '+(a.p||[]).join(' ')).toLowerCase();
  return filter.q.toLowerCase().split(/\s+/).every(w => hay.includes(w));
}

function home(){
  const next = A.find(a=>!read.has(a.id)) || A[0];
  const started = read.size > 0;
  app.innerHTML = `
  <div class="hero">
    <h1>Everything that happened, in order.</h1>
    <p>${A.length} articles telling the story of the world, from the Big Bang to the present day: the wars, the empires, the
    revolutions, the migrations and the ideas that shaped them. You don't need to know anything about history, politics or
    philosophy to start. Read from the top and each article builds on the last. Every article is told as a story in the voice of a certain silver-tongued Boston lawyer, and you can switch to a plain, just-the-facts version at any time.</p>
    <div class="btnrow">
      <a class="btn primary" href="#/a/${next.id}">${started ? 'Continue: '+esc(next.t) : 'Start at the beginning'}</a>
      <a class="btn" href="#/ideas">Learn the key ideas first</a>
    </div>
    <div class="stats">${read.size} of ${A.length} read · ${H.eras.length} eras · ${H.concepts.length} key ideas explained</div>
  </div>
  <div class="tools">
    <input class="search" id="q" type="search" placeholder="Search events, people, places…" value="${esc(filter.q)}">
    <div class="chips" id="chips">
      <button class="chip ${!filter.cat?'on':''}" data-c="">All</button>
      ${Object.entries(CATS).map(([k,v])=>`<button class="chip ${filter.cat===k?'on':''}" data-c="${k}">${v}</button>`).join('')}
    </div>
  </div>
  <div class="eranav">${H.eras.map(e=>`<a href="#era-${e.id}">${esc(e.short)}</a>`).join('')}</div>
  <div id="list"></div>`;
  renderList();
  const q = document.getElementById('q');
  q.addEventListener('input', ()=>{ filter.q = q.value.trim(); renderList(); });
  document.getElementById('chips').addEventListener('click', e=>{
    const b = e.target.closest('.chip'); if (!b) return;
    filter.cat = b.dataset.c;
    document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on', x===b));
    renderList();
  });
  document.querySelectorAll('.eranav a').forEach(l=>l.addEventListener('click', e=>{
    e.preventDefault();
    const t = document.getElementById(l.getAttribute('href').slice(1));
    if (t) window.scrollTo({top: t.getBoundingClientRect().top + scrollY - 150, behavior:'smooth'});
  }));
}

function renderList(){
  const list = document.getElementById('list');
  let html = '', total = 0;
  for (const e of H.eras){
    const items = A.filter(a=>a.era===e && matches(a));
    if (!items.length) continue;
    total += items.length;
    html += `<section class="era" id="era-${e.id}">
      <div class="erahead"><div class="span">${esc(e.span)}</div><h2>${esc(e.name)}</h2><p>${esc(e.summary)}</p>
      <details><summary>Read the era introduction</summary>${e.intro.split('\n\n').map(p=>`<p>${esc(p)}</p>`).join('')}</details></div>
      <ol class="timeline">${items.map(a=>`<li class="${read.has(a.id)?'read':''}"><a class="card" href="#/a/${a.id}">
        <div class="date">${esc(a.d)} · ${esc(a.r)}</div>
        <h3>${esc(a.t)}${read.has(a.id)?'<span class="check">✓</span>':''}</h3>
        <p>${esc(a.s)}</p><div style="margin-top:4px">${tags(a)}</div></a></li>`).join('')}</ol></section>`;
  }
  list.innerHTML = total ? html : '<div class="empty">Nothing matches that search.</div>';
}

function article(id){
  const a = byId[id]; if (!a) return notFound();
  const prev = A[a.i-1], next = A[a.i+1];
  const rel = (a.l||[]).map(x=>byId[x]).filter(Boolean);
  const ideas = (a.k||[]).map(x=>C[x]).filter(Boolean);
  const story = H.stories[a.id], useStory = story && voice==='story';
  app.innerHTML = `<article class="full">
    <div class="crumbs"><a href="#/">Timeline</a> › <a href="#/" data-era="${a.era.id}">${esc(a.era.name)}</a></div>
    <div>${tags(a)}</div>
    <h1>${esc(a.t)}</h1>
    <div class="meta"><span>📅 ${esc(a.d)}</span><span>🌍 ${esc(a.r)}</span><span>${a.i+1} of ${A.length}</span></div>
    <p class="lede">${esc(a.s)}</p>
    ${story?`<div class="voice" role="group" aria-label="Reading style">
      <button class="${voice==='story'?'on':''}" data-voice="story">🎙 Told by Alan Shore</button>
      <button class="${voice==='plain'?'on':''}" data-voice="plain">📄 Just the facts</button></div>`:''}
    <div class="body ${useStory?'story':''}">${(useStory?story:a.b).trim().split(/\n\s*\n/).map(p=>`<p>${esc(p.trim())}</p>`).join('')}</div>
    <div class="box"><h4>Why it matters</h4><p>${esc(a.m)}</p></div>
    ${a.p&&a.p.length?`<div class="box"><h4>Key people</h4><p>${a.p.map(esc).join(' · ')}</p></div>`:''}
    ${ideas.length?`<div class="box"><h4>Ideas to understand</h4><div class="linkrow">${ideas.map(c=>`<a href="#/idea/${c.id}">${esc(c.t)}</a>`).join('')}</div></div>`:''}
    ${rel.length?`<div class="box"><h4>Connected events</h4><div class="linkrow">${rel.map(r=>`<a href="#/a/${r.id}">${esc(r.t)} <small style="color:var(--muted)">${esc(r.d)}</small></a>`).join('')}</div></div>`:''}
    <button class="btn markbtn" id="mark">${read.has(a.id)?'✓ Read — mark as unread':'Mark as read'}</button>
    <div class="pager">
      ${prev?`<a href="#/a/${prev.id}"><small>← Earlier</small><span>${esc(prev.t)}</span></a>`:'<span></span>'}
      ${next?`<a class="next" href="#/a/${next.id}" data-mark="1"><small>Next in time →</small><span>${esc(next.t)}</span></a>`:'<span></span>'}
    </div></article>`;
  document.getElementById('mark').onclick = ()=>{
    read.has(a.id) ? read.delete(a.id) : read.add(a.id);
    store.set('read',[...read]); updateProgress(); article(id);
  };
  app.querySelectorAll('[data-voice]').forEach(b=>b.onclick = ()=>{
    voice = b.dataset.voice; store.set('voice', voice);
    const y = scrollY; article(id); window.scrollTo(0, y);
  });
  const n = app.querySelector('[data-mark]');
  if (n) n.addEventListener('click', ()=>{ read.add(a.id); store.set('read',[...read]); updateProgress(); });
  const ec = app.querySelector('[data-era]');
  ec.addEventListener('click', e=>{ e.preventDefault(); location.hash = '#/'; setTimeout(()=>{
    const t = document.getElementById('era-'+a.era.id); if (t) window.scrollTo({top:t.getBoundingClientRect().top+scrollY-150}); }, 0); });
  document.title = a.t + ' · The Story of the World';
  window.scrollTo(0,0);
}

function ideas(){
  const groups = {};
  H.concepts.forEach(c=>{ (groups[c.g] = groups[c.g] || []).push(c); });
  app.innerHTML = `<div class="hero"><h1>The key ideas</h1>
    <p>History is full of words like <em>empire</em>, <em>democracy</em>, <em>capitalism</em> or <em>nationalism</em>. If any of them are
    fuzzy, read these short explainers first. Every article links to the ideas it relies on.</p></div>
    ${Object.entries(groups).map(([g,list])=>`<h2 class="grouphead">${esc(g)}</h2><div class="concepts">
      ${list.map(c=>`<a href="#/idea/${c.id}"><b>${esc(c.t)}</b><span>${esc(c.s)}</span></a>`).join('')}</div>`).join('')}`;
  document.title = 'Key ideas · The Story of the World';
  window.scrollTo(0,0);
}

function idea(id){
  const c = C[id]; if (!c) return notFound();
  const uses = A.filter(a=>(a.k||[]).includes(id));
  app.innerHTML = `<article class="full">
    <div class="crumbs"><a href="#/ideas">Key ideas</a> › ${esc(c.g)}</div>
    <h1>${esc(c.t)}</h1>
    <p class="lede">${esc(c.s)}</p>
    <div class="body">${c.b.trim().split(/\n\s*\n/).map(p=>`<p>${esc(p.trim())}</p>`).join('')}</div>
    ${uses.length?`<div class="box"><h4>See it in history</h4><div class="linkrow">${uses.map(r=>`<a href="#/a/${r.id}">${esc(r.t)} <small style="color:var(--muted)">${esc(r.d)}</small></a>`).join('')}</div></div>`:''}
  </article>`;
  document.title = c.t + ' · The Story of the World';
  window.scrollTo(0,0);
}

function notFound(){ app.innerHTML = '<div class="empty">That page does not exist. <a href="#/">Back to the timeline</a></div>'; }

function route(){
  const h = location.hash.replace(/^#\/?/,'');
  const [kind, id] = h.split('/');
  document.querySelectorAll('nav.tabs a').forEach(t=>t.classList.toggle('on',
    (t.dataset.tab==='home' && (!kind)) || (t.dataset.tab==='ideas' && (kind==='ideas'||kind==='idea'))));
  if (kind==='a') article(id);
  else if (kind==='ideas') ideas();
  else if (kind==='idea') idea(id);
  else { document.title = 'The Story of the World'; home(); }
}

const root = document.documentElement;
const savedTheme = store.get('theme', null);
if (savedTheme) root.dataset.theme = savedTheme;
document.getElementById('theme').onclick = ()=>{
  const dark = root.dataset.theme ? root.dataset.theme==='dark' : matchMedia('(prefers-color-scheme:dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark'; store.set('theme', root.dataset.theme);
};
window.addEventListener('hashchange', route);
updateProgress(); route();
})();
</script>
</body>
</html>
